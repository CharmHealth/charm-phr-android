            buildConfigField "boolean", "IS_CUSTOM_APP", "true"
            buildConfigField "boolean", "IS_THALASSEMIA", "false"
            buildConfigField "boolean", "IS_VIDEO_CALL_ENABLED", "true"
            buildConfigField "boolean", "IS_PUSH_NOTIFICATION_ENABLED", "true"
            buildConfigField "boolean", "IS_IN_APP_RATINGS_ENABLED", "true"
            buildConfigField "boolean", "IS_OAUTH_ENABLED", "true"
        }
//
