import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'apptics-plugin'
    id 'project-report'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
}

android {

    namespace 'com.charm.phr.mphr'
    compileSdk 37

    defaultConfig {
        applicationId "com.charm.phr"
        minSdkVersion 24
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        ndk.abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'

        resourceConfigurations += ['en']

        // CharmAuth (charm-mobile-auth-sdk) settings. Per environment and not secret; set them in
        // secure.properties (or gradle.properties / -P). See docs/setup.md.
        def charmAuth = { String key, String fallback = "" ->
            (rootProject.ext.secrets["charmAuth.$key"] ?: project.findProperty("charmAuth.$key") ?: fallback).toString()
        }
        buildConfigField "String", "CHARM_AUTH_ISSUER", "\"${charmAuth('issuer')}\""
        buildConfigField "String", "CHARM_AUTH_CLIENT_ID", "\"${charmAuth('clientId')}\""
        buildConfigField "String", "CHARM_AUTH_AUDIENCE", "\"${charmAuth('audience')}\""
        // Space-separated scopes added to openid profile email offline_access.
        buildConfigField "String", "CHARM_AUTH_ADDITIONAL_SCOPES", "\"${charmAuth('additionalScopes')}\""
        // Comma-separated origins (scheme://host[:port]) the access token may be sent to.
        buildConfigField "String", "CHARM_AUTH_API_ORIGINS", "\"${charmAuth('apiOrigins', 'https://phr2.charmtracker.com')}\""
    }

    signingConfigs {
        config {
            storeFile file("charm-mehr-android-release-key.jks")
            storePassword System.getenv("CHARM_KSTOREPWD")
            keyPassword System.getenv("CHARM_KEYPWD")
            keyAlias System.getenv("CHARM_RELKEY")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            // applicationIdSuffix ".development"
            versionNameSuffix "-DEBUG"
            ndk {
                // Overriding abiFilters for debug build type
                abiFilters "arm64-v8a"
            }
        }
    }


    flavorDimensions "version"

    productFlavors {

        ext.version_code = 10121
        ext.version_name = '1.6.6'


        common {
            dimension "version"
            applicationIdSuffix = ".mphr"
            versionCode = version_code
            versionName = "$version_name"
            buildConfigField "boolean", "IS_CUSTOM_APP", "false"
            buildConfigField "boolean", "IS_THALASSEMIA", "false"
            buildConfigField "boolean", "IS_VIDEO_CALL_ENABLED", "true"
            buildConfigField "boolean", "IS_PUSH_NOTIFICATION_ENABLED", "true"
            buildConfigField "boolean", "IS_IN_APP_RATINGS_ENABLED", "true"
            buildConfigField "boolean", "IS_OAUTH_ENABLED", "true"
        }

        dev {
            dimension "version"
            applicationId = "com.charm.phr.mphr.development"
            versionCode = version_code
            versionName = "$version_name"
            buildConfigField "boolean", "IS_CUSTOM_APP", "false"
            buildConfigField "boolean", "IS_THALASSEMIA", "false"
            buildConfigField "boolean", "IS_VIDEO_CALL_ENABLED", "true"
            buildConfigField "boolean", "IS_PUSH_NOTIFICATION_ENABLED", "true"
            buildConfigField "boolean", "IS_IN_APP_RATINGS_ENABLED", "true"
            buildConfigField "boolean", "IS_OAUTH_ENABLED", "true"
        }

        // Place thalassemia-specific google-services.json in app/src/thalassemia/google-services.json
        thalassemia {
            dimension "version"
            applicationId = "com.vtitan.thalassure"
            versionCode = 10000
            versionName = "0.0.1"
            buildConfigField "boolean", "IS_CUSTOM_APP", "false"
            buildConfigField "boolean", "IS_THALASSEMIA", "true"
            buildConfigField "boolean", "IS_VIDEO_CALL_ENABLED", "false"
            buildConfigField "boolean", "IS_PUSH_NOTIFICATION_ENABLED", "false"
            buildConfigField "boolean", "IS_IN_APP_RATINGS_ENABLED", "false"
            buildConfigField "boolean", "IS_OAUTH_ENABLED", "true"
        }

//        ayusurance {
