//            dimension "version"
//            applicationId = "com.medicalmine.phr.customBrandedApp128"
//            versionCode = version_code
//            versionName = "$version_name"
//        }
    }

    sourceSets {

        main {
            java.srcDirs = ['src/main/java', 'src/main/java/modal', 'src/main/libs']
            res { srcDirs 'src/main/res', 'src/main/res/zoom' }
        }

        thalassemia { res.srcDirs = ['src/thalassemia/res', 'src/thalassemia/res/'] }

//        ayusurance { res.srcDirs = ['src/ayusurance/res', 'src/ayusurance/res/'] }
//
//        mabel { res.srcDirs = ['src/mabel/res', 'src/mabel/res/'] }
