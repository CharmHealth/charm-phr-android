        androidTest.assets.srcDirs +=
                files("$projectDir/schemas".toString())

    }

    bundle {
        abi { enableSplit = true }
        density { enableSplit = true }
        language { enableSplit = true }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // composeOptions removed — Kotlin 2.x uses org.jetbrains.kotlin.plugin.compose instead
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        resources {
            excludes += ['**/*.md']
        }
    }


}

// CharmAuth redirect: <applicationId>:/oauth2/callback, so every flavor gets its own scheme.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.manifestPlaceholders.put("charmAuthRedirectScheme", variant.applicationId)
    }
}

// Warn (the app reports the details at launch) when CharmAuth isn't configured.
['issuer', 'clientId'].each { key ->
    if (!(rootProject.ext.secrets["charmAuth.$key"] ?: project.findProperty("charmAuth.$key"))) {
        logger.warn("charmAuth.$key is not set (secure.properties): sign-in will report the missing setting.")
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

afterEvaluate {
    tasks.matching {
        (it.name.contains("Thalassemia") || it.name.contains("NeuroConnect")) && it.name.contains("GoogleServices")
    }.configureEach {
        enabled = false
    }
}


